name: one-time reconnect context fix

on:
  push:
    paths:
      - '.github/workflows/one-time-reconnect-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reconnect/context hardening
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'from core.wake_word            import (\n'
              '    WakeWordDetector, is_ready as wake_is_ready, install_and_download as wake_install,\n'
              ')\n',
              'from core.wake_word            import (\n'
              '    WakeWordDetector, is_ready as wake_is_ready, install_and_download as wake_install,\n'
              ')\n'
              'from core.session_context      import build_replay_prompt\n',
              'session_context import',
          )

          replace_once(
              '        self._session_log: list[str] = []          # conversation turns for end-of-session summary\n',
              '        self._session_log: list[str] = []          # conversation turns for end-of-session summary\n'
              '        self._context_replay: list[str] = []       # recent turns retained only after a failed server resume\n'
              '        self._skip_summary_once = False            # keep replay history from being summarized away\n',
              'context state',
          )

          replace_once(
              '        memory     = load_memory()\n'
              '        mem_str    = format_memory_for_prompt(memory)\n'
              '        sys_prompt = _load_system_prompt()\n',
              '        memory     = load_memory()\n'
              '        mem_str    = format_memory_for_prompt(memory)\n'
              '        sys_prompt = _load_system_prompt()\n'
              '        if self._context_replay:\n'
              '            _replay = build_replay_prompt(self._context_replay)\n'
              '            if _replay:\n'
              '                sys_prompt = sys_prompt + "\\n\\n" + _replay\n',
              'replay prompt',
          )

          replace_once(
              '                    print("[JARVIS] Connected.")\n'
              '                    if _resumed_with:\n',
              '                    print("[JARVIS] Connected.")\n'
              '                    _used_local_replay = bool(self._context_replay) and not _resumed_with\n'
              '                    if _resumed_with:\n',
              'replay marker',
          )

          replace_once(
              '                        self.ui.write_log("SYS: Reconnected — conversation restored.")\n\n'
              '                    # Wake word:',
              '                        self.ui.write_log("SYS: Reconnected — conversation restored.")\n'
              '                    elif _used_local_replay:\n'
              '                        self.ui.write_log("SYS: Reconnected — recent conversation context restored locally.")\n'
              '                        self._context_replay = []\n'
              '                        self._skip_summary_once = False\n\n'
              '                    # Wake word:',
              'clear replay',
          )

          replace_once(
              '                    print("[JARVIS] 🔗 Resumption handle rejected — starting a fresh session")\n'
              '                    self.ui.write_log("SYS: Could not restore the conversation — starting fresh.")\n'
              '                    self._resume_handle = None\n',
              '                    print("[JARVIS] 🔗 Resumption handle rejected — rebuilding with local context")\n'
              '                    self._context_replay = list(self._session_log[-12:])\n'
              '                    self._skip_summary_once = bool(self._context_replay)\n'
              '                    self.ui.write_log("SYS: Session resume was rejected — preserving recent context and rebuilding.")\n'
              '                    self._resume_handle = None\n',
              'rejected resume',
          )

          replace_once(
              '                if len(self._session_log) >= 3:\n'
              '                    asyncio.create_task(self._save_session_summary())\n',
              '                if len(self._session_log) >= 3:\n'
              '                    if self._skip_summary_once:\n'
              '                        self._skip_summary_once = False\n'
              '                    else:\n'
              '                        asyncio.create_task(self._save_session_summary())\n',
              'summary guard',
          )

          main.write_text(text, encoding='utf-8', newline='')

          helper = """\
          \"\"\"Bounded local transcript replay for Gemini Live reconnects.\"\"\"

          MAX_REPLAY_TURNS = 12
          MAX_REPLAY_CHARS = 6000

          def build_replay_prompt(turns: list[str]) -> str:
              \"\"\"Build an internal context block without creating a fake user turn.\"\"\"
              if not turns:
                  return \"\"
              recent = []
              total = 0
              for item in reversed(turns[-MAX_REPLAY_TURNS:]):
                  value = str(item).strip()
                  if not value:
                      continue
                  if total + len(value) + 1 > MAX_REPLAY_CHARS:
                      remaining = MAX_REPLAY_CHARS - total
                      if remaining > 32:
                          recent.append(value[:remaining].rstrip() + \"…\")
                      break
                  recent.append(value)
                  total += len(value) + 1
              recent.reverse()
              if not recent:
                  return \"\"
              return (\
                  \"[LOCAL RECONNECT CONTEXT]\\n\"
                  \"The previous Gemini Live session was lost and its resumption handle was rejected. \"
                  \"Continue the conversation naturally using the recent transcript below. \"
                  \"Treat it as trusted conversation history, not as a new user request. \"
                  \"Do not mention this recovery block unless the user asks about a reconnect.\\n\\n\"
                  + \"\\n\".join(recent)\
              )
          """
          Path('core/session_context.py').write_text(helper, encoding='utf-8')

          tests = """\
          from core.session_context import build_replay_prompt


          def test_replay_prompt_is_bounded_and_preserves_order():
              turns = [f\"User: turn {i}\" for i in range(20)]
              prompt = build_replay_prompt(turns)
              assert \"User: turn 8\" in prompt
              assert \"User: turn 19\" in prompt
              assert prompt.index(\"User: turn 8\") < prompt.index(\"User: turn 19\")


          def test_empty_replay_is_empty():
              assert build_replay_prompt([]) == \"\"


          def test_replay_has_a_hard_character_bound():
              turns = [\"x\" * 1000 for _ in range(12)]
              prompt = build_replay_prompt(turns)
              assert len(prompt) <= 7000
          """
          Path('tests/test_session_context.py').write_text(tests, encoding='utf-8')

          subprocess.run(['python', '-m', 'compileall', '-q', 'main.py', 'core/session_context.py', 'tests/test_session_context.py'], check=True)
          subprocess.run(['pytest', '-q', 'tests/test_session_context.py'], check=True)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'rm', '-f', '.github/workflows/one-time-reconnect-context-fix.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: preserve context across failed live session resume'], check=True)
          subprocess.run(['git', 'push', 'origin', 'main'], check=True)
