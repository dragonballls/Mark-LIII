name: Windows self-coding smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Verify OpenHands integration imports
        shell: pwsh
        run: |
          python -c "from integrations.openhands_agent import available; assert available(), 'OpenHands SDK/tools import check failed'; print('OpenHands integration: available')"
          python -c "from core.action_loader import discover_actions; from pathlib import Path; r=discover_actions(Path('actions'), logger=print); assert r.has('openhands_self_coder'), 'openhands_self_coder was not discovered'; print('Action discovery: openhands_self_coder loaded')"
