name: Self-coding validation

on:
  push:
    branches: [main, auto-update-hardening]
  pull_request:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest google-genai
      - name: Compile plugin and main entry code
        run: python -m compileall -q self_coding_engine plugins main.py sitecustomize.py core
      - name: Run regression tests
        run: python -m pytest -q tests/test_self_coding_plugin.py tests/test_jarvis_voice_plugin.py tests/test_voice_language_and_browser_setup.py tests/test_single_instance_guard.py tests/test_auto_updater.py
