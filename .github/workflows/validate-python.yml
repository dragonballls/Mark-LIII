name: Validate Python

on:
  push:
    branches: [main, add-upstream-auto-updater]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q main.py ui.py actions core memory plugins dashboard
      - name: Validate updater modules
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [Path('core/self_updater.py'), Path('actions/check_for_updates.py'), Path('core/action_loader.py')]:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'OK: {path}')
          PY
